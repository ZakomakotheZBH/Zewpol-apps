<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zewpol Maps | Geospatial Intelligence</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --accent: #00f260;
      --secondary: #0575e6;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text: #ffffff;
      --panel-bg: rgba(10, 8, 30, 0.95);
    }

    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: "Inter", sans-serif;
      background: #0f0c29; color: var(--text);
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 70px;
      padding: 0 25px; display: flex; justify-content: space-between;
      align-items: center; background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border);
      z-index: 1000;
    }

    .brand {
      font-weight: 900; font-size: 1.5rem;
      background: linear-gradient(90deg, var(--accent), var(--secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    /* Map Layout */
    #map {
      width: 100%; height: 100vh;
      background: #0b091e;
    }

    /* Map UI Overlays */
    .map-controls {
      position: absolute; top: 90px; left: 20px; z-index: 1000;
      width: 300px; display: flex; flex-direction: column; gap: 15px;
    }

    .search-box {
      background: var(--panel-bg); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 10px; display: flex; gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .search-box input {
      flex: 1; background: transparent; border: none; color: white;
      outline: none; font-size: 0.9rem;
    }

    .coord-panel {
      background: var(--panel-bg); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 15px; font-family: monospace;
      font-size: 0.8rem; color: var(--accent);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .btn-action {
      background: var(--accent); color: #000; border: none;
      padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
      color: white; padding: 10px 20px; border-radius: 12px;
      font-weight: bold; cursor: pointer; text-decoration: none; font-size: 0.9rem;
    }

    /* Customizing the Leaflet Map appearance to be dark */
    .leaflet-container { background: #0b091e !important; }
    .leaflet-bar a { background: var(--panel-bg) !important; color: var(--accent) !important; border: 1px solid var(--glass-border) !important; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="top-bar">
  <div class="brand">ZEWPOL MAPS</div>
  <a href="index.html" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back to Search</a>
</div>

<div class="map-controls">
  <div class="search-box">
    <input type="text" id="locationInput" placeholder="Locate coordinates...">
    <button class="btn-action" onclick="mapApp.search()"><i class="fa-solid fa-crosshairs"></i></button>
  </div>

  <div class="coord-panel">
    <div style="text-transform: uppercase; font-size: 0.7rem; opacity: 0.6; margin-bottom: 5px;">Live Telemetry</div>
    <div>LAT: <span id="latDisp">0.0000</span></div>
    <div>LNG: <span id="lngDisp">0.0000</span></div>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const mapApp = {
    map: null,
    marker: null,

    init: function() {
      // Initialize map with a dark "CartoDB" theme
      this.map = L.map('map', {
        zoomControl: false
      }).setView([51.505, -0.09], 13);

      L.control.zoom({ position: 'bottomright' }).addTo(this.map);

      // Add Dark Matter tiles
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(this.map);

      // Update coordinates on move
      this.map.on('mousemove', (e) => {
        document.getElementById('latDisp').innerText = e.latlng.lat.toFixed(4);
        document.getElementById('lngDisp').innerText = e.latlng.lng.toFixed(4);
      });

      this.marker = L.marker([51.505, -0.09]).addTo(this.map);
    },

    search: async function() {
      const query = document.getElementById('locationInput').value;
      if (!query) return;

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (data.length > 0) {
          const { lat, lon } = data[0];
          const coords = [parseFloat(lat), parseFloat(lon)];
          this.map.flyTo(coords, 13);
          this.marker.setLatLng(coords);
        } else {
          alert("Location not found in database.");
        }
      } catch (err) {
        console.error("Geocoding error:", err);
      }
    }
  };

  window.onload = () => mapApp.init();
</script>

</body>
</html>
