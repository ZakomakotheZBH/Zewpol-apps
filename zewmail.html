<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZewMail | Neural Inbox</title>
  <style>
    :root { --acc: #00f260; --bg: #050505; --gl: rgba(255,255,255,0.05); --border: #222; }
    body { margin:0; font-family:'Inter', sans-serif; background:var(--bg); color:#fff; display:flex; height:100vh; overflow:hidden; }
    
    /* Sidebar Navigation */
    .sidebar { width:220px; background:#000; border-right:1px solid var(--border); display:flex; flex-direction:column; padding:20px; }
    .compose-btn { background:var(--acc); color:#000; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer; margin-bottom:30px; }
    .nav-item { padding:10px; border-radius:8px; cursor:pointer; font-size:0.9rem; margin-bottom:5px; opacity:0.6; }
    .nav-item:hover, .active { background:var(--gl); opacity:1; color:var(--acc); }

    /* Inbox List */
    .inbox { width:350px; border-right:1px solid var(--border); overflow-y:auto; background:rgba(255,255,255,0.01); }
    .mail-item { padding:15px; border-bottom:1px solid var(--border); cursor:pointer; transition:0.2s; }
    .mail-item:hover { background:var(--gl); }
    .mail-item b { display:block; font-size:0.9rem; color:var(--acc); margin-bottom:4px; }
    .mail-item span { font-size:0.8rem; opacity:0.7; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* Viewer */
    .viewer { flex:1; padding:40px; display:flex; flex-direction:column; background:#080808; }
    .view-header { border-bottom:1px solid var(--border); padding-bottom:20px; margin-bottom:20px; }
    .view-body { line-height:1.6; font-size:0.95rem; white-space: pre-wrap; }

    /* Compose Modal */
    #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(5px); align-items:center; justify-content:center; }
    .form { background:#111; padding:30px; border-radius:20px; width:500px; border:1px solid var(--acc); }
    input, textarea { width:100%; background:#000; border:1px solid var(--border); padding:10px; margin:10px 0; color:#fff; border-radius:5px; }
    
    .addr { font-size:0.7rem; color:var(--acc); opacity:0.8; margin-bottom:10px; display:block; }
  </style>
</head>
<body>

<div class="sidebar">
  <span class="addr">zakomako6750@zewmail.io</span>
  <button class="compose-btn" onclick="mail.open()">COMPOSE</button>
  <div class="nav-item active">Inbox (2)</div>
  <div class="nav-item">Sent</div>
  <div class="nav-item">Drafts</div>
  <div class="nav-item" onclick="location.href='index.html'" style="margin-top:auto">Exit Engine</div>
</div>

<div class="inbox" id="inboxList"></div>

<div class="viewer" id="viewer">
  <div style="opacity:0.2; text-align:center; margin-top:100px;">
    <h2>SELECT A TRANSMISSION</h2>
  </div>
</div>

<div id="modal">
  <div class="form">
    <h3 style="margin-top:0">New Message</h3>
    <input type="text" id="mTo" placeholder="To: (e.g. system@zewpol.com)">
    <input type="text" id="mSub" placeholder="Subject">
    <textarea id="mBody" rows="8" placeholder="Enter neural data..."></textarea>
    <div style="display:flex; gap:10px">
      <button class="compose-btn" style="flex:1" onclick="mail.send()">SEND</button>
      <button class="compose-btn" style="background:#333; color:#fff" onclick="mail.close()">CANCEL</button>
    </div>
  </div>
</div>

<script>
const mail = {
  data: [
    { from: "Zewpol Admin", sub: "Neural Node Activated", body: "Welcome to your new communication node.\n\nYour address @zakomako6750.neocities.org is now linked to the Zewpol Cloud.\n\nStay secure." },
    { from: "System Core", sub: "Storage Alert", body: "Your virtual storage is currently using 0.02% capacity. Plenty of space remains for your ISOs and Files." }
  ],

  init: function() {
    this.render();
  },

  render: function() {
    const list = document.getElementById('inboxList');
    list.innerHTML = this.data.map((m, i) => `
      <div class="mail-item" onclick="mail.view(${i})">
        <b>${m.from}</b>
        <span>${m.sub}</span>
      </div>
    `).join('');
  },

  view: function(i) {
    const m = this.data[i];
    document.getElementById('viewer').innerHTML = `
      <div class="view-header">
        <h2 style="margin:0">${m.sub}</h2>
        <p style="opacity:0.6; font-size:0.8rem">From: ${m.from}</p>
      </div>
      <div class="view-body">${m.body}</div>
    `;
  },

  open: () => document.getElementById('modal').style.display = 'flex',
  close: () => document.getElementById('modal').style.display = 'none',

  send: function() {
    const to = document.getElementById('mTo').value;
    const sub = document.getElementById('mSub').value;
    const body = document.getElementById('mBody').value;
    
    if(!to || !sub) return alert("Missing fields.");

    alert("Transmission Sent via Neural Relay.");
    this.close();
    // Clear form
    document.getElementById('mTo').value = '';
    document.getElementById('mSub').value = '';
    document.getElementById('mBody').value = '';
  }
};

window.onload = () => mail.init();
</script>

</body>
</html>
