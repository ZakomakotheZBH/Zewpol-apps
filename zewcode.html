<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zewcode | Neural IDE</title>
  <style>
    :root { --acc: #00f260; --bg: #0a0a0a; --gl: rgba(255,255,255,0.05); }
    body { margin:0; font-family:'Inter', sans-serif; background:var(--bg); color:#fff; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    
    /* Header */
    .nav { padding:10px 20px; background:#000; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--gl); }
    .brand { font-weight:900; color:var(--acc); letter-spacing:1px; }

    /* Layout */
    .editor-container { flex:1; display:grid; grid-template-columns: 1fr 1fr; }
    .inputs { display:grid; grid-template-rows: repeat(3, 1fr); border-right:2px solid #000; }
    
    .box { display:flex; flex-direction:column; border-bottom:1px solid var(--gl); }
    .box-label { padding:5px 15px; font-size:0.65rem; background:#111; color:#666; font-weight:bold; }
    
    textarea { flex:1; background:#0a0a0a; color:#d4d4d4; border:none; padding:15px; font-family:'JetBrains Mono', monospace; outline:none; resize:none; font-size:0.85rem; }
    textarea:focus { background:#0d0d0d; color:var(--acc); }

    /* Output Preview */
    #preview { background:#fff; width:100%; height:100%; border:none; }
    
    .btn-run { background:var(--acc); border:none; padding:6px 15px; border-radius:4px; font-weight:bold; cursor:pointer; }
    .back { text-decoration:none; color:#555; font-size:0.8rem; }
  </style>
</head>
<body>

<div class="nav">
  <div><a href="index.html" class="back">TERMINATE</a> &nbsp; <span class="brand">ZEWCODE // IDE</span></div>
  <button class="btn-run" onclick="zewcode.compile()">EXECUTE CODE</button>
</div>

<div class="editor-container">
  <div class="inputs">
    <div class="box">
      <div class="box-label">HTML5 STRUCTURE</div>
      <textarea id="html" placeholder="<html>..."></textarea>
    </div>
    <div class="box">
      <div class="box-label">CSS3 STYLING</div>
      <textarea id="css" placeholder="body { background: #000; }"></textarea>
    </div>
    <div class="box">
      <div class="box-label">JS NEURAL LOGIC</div>
      <textarea id="js" placeholder="console.log('Neural Link Active');"></textarea>
    </div>
  </div>
  
  <div class="output">
    <iframe id="preview"></iframe>
  </div>
</div>

<script>
const zewcode = {
  compile: function() {
    const html = document.getElementById('html').value;
    const css = `<style>${document.getElementById('css').value}</style>`;
    const js = `<script>${document.getElementById('js').value}<\/script>`;
    
    const preview = document.getElementById('preview').contentWindow.document;
    preview.open();
    preview.write(html + css + js);
    preview.close();
  }
};

// Initial template
window.onload = () => {
  document.getElementById('html').value = '<h1 style="font-family:sans-serif;">Neural Sandbox Active</h1>\n<p>Edit code to begin rendering.</p>';
  document.getElementById('css').value = 'body { background: #fff; color: #000; padding: 40px; }';
  zewcode.compile();
};
</script>

</body>
</html>
