<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZewAI | Neural Chat</title>
  <style>
    :root { --acc: #00f260; --sec: #0575e6; --bg: #0a081e; --gl: rgba(255,255,255,0.1); }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; display: flex; flex-direction: column; height: 100vh; }
    
    .nav { padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gl); background: rgba(0,0,0,0.5); }
    .nav b { color: var(--acc); letter-spacing: 1px; }
    
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .msg { padding: 12px 16px; border-radius: 15px; max-width: 80%; line-height: 1.4; font-size: 0.9rem; }
    .user { align-self: flex-end; background: var(--sec); }
    .bot { align-self: flex-start; background: var(--gl); border: 1px solid rgba(255,255,255,0.1); }
    
    .input-area { padding: 20px; background: rgba(0,0,0,0.3); display: flex; gap: 10px; }
    input { flex: 1; background: #000; border: 1px solid var(--gl); padding: 12px; border-radius: 10px; color: #fff; outline: none; }
    button { background: var(--acc); border: none; padding: 0 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }

    .btn-exit { color: #fff; text-decoration: none; font-size: 0.8rem; opacity: 0.6; }
    .typing { font-style: italic; opacity: 0.5; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="nav">
  <b>ZEWAI // CORE</b>
  <a href="index.html" class="btn-exit">TERMINATE SESSION</a>
</div>

<div id="chat">
  <div class="msg bot">Neural link established. Query the Zewpol Intelligence database.</div>
</div>

<div class="input-area">
  <input type="text" id="in" placeholder="Ask anything..." onkeypress="if(event.key==='Enter') ai.send()">
  <button onclick="ai.send()">SEND</button>
</div>

<script>
const ai = {
  send: async function() {
    const i = document.getElementById('in');
    const txt = i.value.trim();
    if (!txt) return;

    this.addMsg(txt, 'user');
    i.value = '';

    const b = this.addMsg('Thinking...', 'bot typing');
    
    try {
      // Using a lightweight open endpoint (DuckDuckGo or similar proxy style) 
      // Replace URL/Key with your preferred lightweight API to keep it free
      const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(txt)}&format=json`);
      const data = await res.json();
      b.innerText = data.AbstractText || "Information segment not found. Try a broader query.";
      b.classList.remove('typing');
    } catch (e) {
      b.innerText = "Connection interrupt. Neural core offline.";
    }
    document.getElementById('chat').scrollTop = 99999;
  },
  
  addMsg: function(t, c) {
    const d = document.createElement('div');
    d.className = 'msg ' + c;
    d.innerText = t;
    document.getElementById('chat').appendChild(d);
    return d;
  }
};
</script>

</body>
</html>
