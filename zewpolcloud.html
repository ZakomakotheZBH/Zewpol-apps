<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zewpol Cloud | Neural File Stream</title>
  <style>
    :root {
      --accent: #00f260;
      --secondary: #0575e6;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text: #ffffff;
      --panel-bg: rgba(10, 8, 30, 0.98);
      --danger: #ff4b2b;
    }

    body {
      margin: 0; font-family: "Inter", -apple-system, sans-serif;
      background: #0f0c29; color: var(--text);
      min-height: 100vh; overflow-x: hidden;
    }

    /* Top Bar */
    .top-bar {
      height: 70px; padding: 0 25px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
    }

    .brand {
      font-weight: 900; font-size: 1.5rem;
      background: linear-gradient(90deg, var(--accent), var(--secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .container { padding: 40px; max-width: 1200px; margin: 0 auto; }

    /* Upload Area */
    .upload-zone {
      border: 2px dashed var(--glass-border); border-radius: 24px;
      padding: 60px 20px; text-align: center; background: rgba(255,255,255,0.02);
      transition: 0.3s; cursor: pointer; position: relative;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent); background: rgba(0, 242, 96, 0.05);
    }
    #fileInput { display: none; }

    /* File Grid */
    .file-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px; margin-top: 30px;
    }

    .file-card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 18px; padding: 20px; text-align: center;
      transition: 0.3s; position: relative; animation: fadeIn 0.4s ease;
    }
    .file-card:hover { border-color: var(--accent); transform: translateY(-5px); }
    
    .file-icon { font-size: 2.5rem; margin-bottom: 12px; color: var(--secondary); }
    .file-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .file-size { font-size: 0.75rem; opacity: 0.5; }

    .delete-btn {
      position: absolute; top: 10px; right: 10px;
      color: var(--danger); cursor: pointer; opacity: 0; transition: 0.2s;
    }
    .file-card:hover .delete-btn { opacity: 1; }

    /* Buttons */
    .btn-action { 
      background: linear-gradient(90deg, var(--accent), var(--secondary)); 
      border: none; padding: 12px 28px; border-radius: 12px; 
      color: white; font-weight: bold; cursor: pointer; text-decoration: none;
    }
    .btn-secondary { 
      background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); 
      color: white; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; text-decoration: none;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .empty-state { text-align: center; padding: 40px; opacity: 0.4; grid-column: 1 / -1; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="top-bar">
  <div class="brand">ZEWPOL CLOUD</div>
  <a href="index.html" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back to Search</a>
</div>

<div class="container">
  <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <input type="file" id="fileInput" multiple onchange="cloud.handleFiles(this.files)">
    <i class="fa-solid fa-cloud-arrow-up" style="font-size: 3.5rem; color: var(--accent); margin-bottom: 15px;"></i>
    <h2>Secure Neural Uplink</h2>
    <p style="opacity: 0.6; margin-bottom: 20px;">Click or drag files to store in the local segment.</p>
    <button class="btn-action">SELECT FILES</button>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:50px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px;">
    <h3 style="margin:0; border-left: 3px solid var(--accent); padding-left: 15px;">Stored Sequences</h3>
    <span id="storageCount" style="font-size: 0.8rem; opacity: 0.6;">0 Files</span>
  </div>

  <div class="file-grid" id="fileGrid">
    </div>
</div>

<script>
  const cloud = {
    files: [],

    init: function() {
      // Load from localStorage
      const saved = localStorage.getItem('zew_cloud_files');
      if (saved) {
        this.files = JSON.parse(saved);
        this.render();
      }
      this.setupDragDrop();
    },

    setupDragDrop: function() {
      const zone = document.getElementById('dropZone');
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(name => {
        zone.addEventListener(name, e => {
          e.preventDefault();
          e.stopPropagation();
        });
      });
      zone.addEventListener('dragover', () => zone.classList.add('dragover'));
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', (e) => {
        zone.classList.remove('dragover');
        this.handleFiles(e.dataTransfer.files);
      });
    },

    handleFiles: function(fileList) {
      Array.from(fileList).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          this.files.push({
            id: Date.now() + Math.random(),
            name: file.name,
            size: this.formatSize(file.size),
            type: file.type,
            data: e.target.result // Base64 Data
          });
          this.save();
          this.render();
        };
        reader.readAsDataURL(file);
      });
    },

    formatSize: function(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    },

    deleteFile: function(id) {
      this.files = this.files.filter(f => f.id !== id);
      this.save();
      this.render();
    },

    save: function() {
      try {
        localStorage.setItem('zew_cloud_files', JSON.stringify(this.files));
      } catch (e) {
        alert("Storage limit reached! LocalStorage is full.");
      }
    },

    getIcon: function(type) {
      if (type.includes('image')) return 'fa-file-image';
      if (type.includes('video')) return 'fa-file-video';
      if (type.includes('pdf')) return 'fa-file-pdf';
      if (type.includes('javascript') || type.includes('html')) return 'fa-file-code';
      return 'fa-file-lines';
    },

    render: function() {
      const grid = document.getElementById('fileGrid');
      document.getElementById('storageCount').innerText = `${this.files.length} Files`;
      
      if (this.files.length === 0) {
        grid.innerHTML = `<div class="empty-state"><i class="fa-solid fa-folder-open" style="font-size: 3rem; display: block; margin-bottom: 10px;"></i>No files detected in segment.</div>`;
        return;
      }

      grid.innerHTML = this.files.map(f => `
        <div class="file-card">
          <div class="delete-btn" onclick="cloud.deleteFile(${f.id})"><i class="fa-solid fa-circle-xmark"></i></div>
          <i class="fa-solid ${this.getIcon(f.type)} file-icon"></i>
          <div class="file-name" title="${f.name}">${f.name}</div>
          <div class="file-size">${f.size}</div>
        </div>
      `).join('');
    }
  };

  window.onload = () => cloud.init();
</script>

</body>
</html>
